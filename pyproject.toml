[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobhunter"
version = "0.1.6"
description = "Reverse due-diligence CLI for Chinese job seekers"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dayebishouji" }]

dependencies = [
  "anthropic>=0.40.0",
  "tavily-python>=0.5.0",
  "click>=8.1",
  "inquirerpy>=0.3.4",
  "rich>=13.7",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "tenacity>=8.3",
  "python-dotenv>=1.0",
  "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "respx>=0.21",
  "freezegun>=1.5",
  "ruff>=0.5",
]

[project.scripts]
jobhunter = "jobhunter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
